# Test profile: fresh H2 schema for every test run.
spring:
  datasource:
    url: jdbc:h2:mem:dealership-test;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        hbm2ddl.auto: create-drop
  thymeleaf:
    cache: false
  sql:
    init:
      mode: never

logging:
  level:
    org.springframework.security: WARN
