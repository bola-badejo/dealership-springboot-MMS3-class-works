spring:
  application:
    name: dealership

  datasource:
    url: jdbc:postgresql://localhost:5432/dealership
    username: dealership
    password: dealership
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
          
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    
  thymeleaf:
    cache: false
    
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  web:
    error:
      include-message: always
      include-binding-errors: always
      
server:
  port: 8080

logging:
  level:
    root: WARN
    com.dealership: DEBUG
    org.springframework.security: INFO
    
app:
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-long-random-string-in-production-at-least-64-characters-ok}
    expiration-ms: 86400000
  upload:
    directory: ./uploads
  payment:
    gateway: mock