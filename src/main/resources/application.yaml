# ============================================================================
#  Dealership app — Spring Boot configuration
# ----------------------------------------------------------------------------
#  Students: this file controls how the app boots. Each key maps to a Java
#  property that Spring reads at startup. Indentation matters in YAML.
# ============================================================================

spring:
  application:
    name: dealership              # The logical name of our app (shows up in logs).

  # ---- Default profile: in-memory H2 so you can run the app with zero setup.
  datasource:
    url: jdbc:h2:mem:dealership;DB_CLOSE_DELAY=-1   # mem: lives only while the app runs.
    driver-class-name: org.h2.Driver                # Which JDBC driver to use.
    username: sa                                    # Default H2 user.
    password:                                       # No password in dev.

  # ---- H2's web console lets you browse the DB during development.
  h2:
    console:
      enabled: true
      path: /h2-console                             # Visit http://localhost:8080/h2-console

  # ---- JPA / Hibernate settings
  jpa:
    hibernate:
      ddl-auto: update            # Hibernate creates/updates tables from our @Entity classes.
    show-sql: true                # Print SQL statements to the console (great for learning).
    properties:
      hibernate:
        format_sql: true          # Pretty-print those SQL statements.

  # ---- Thymeleaf template engine (renders our HTML views)
  thymeleaf:
    cache: false                  # Disable template cache so edits appear on refresh in dev.

# ---- Server port (default 8080). Change if 8080 is busy on your machine.
server:
  port: 8080

# ---- Logging levels. DEBUG = verbose, INFO = normal.
logging:
  level:
    com.smkngun.dealership: DEBUG
    org.springframework.security: INFO

---
# ============================================================================
#  "postgres" profile — switch on with:  --spring.profiles.active=postgres
#  Use this when you want a real database running on your machine.
# ============================================================================
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://localhost:5432/dealership
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
