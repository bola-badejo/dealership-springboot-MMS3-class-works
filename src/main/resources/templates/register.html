<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Sign up')}"></head>
<body>

<nav th:replace="~{fragments/layout :: nav}"></nav>

<main class="container">
    <div class="form-card">
        <h1>Create your account</h1>

        <div th:if="${regError}" class="alert alert-error" th:text="${regError}"></div>

        <!-- th:object binds the whole form to our RegistrationForm DTO. -->
        <form th:action="@{/register}" th:object="${form}" method="post">
            <div class="field">
                <label>Username</label>
                <input type="text" th:field="*{username}" required/>
                <!-- th:errors renders validation messages for this field. -->
                <div class="err" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
            </div>
            <div class="field">
                <label>Full name</label>
                <input type="text" th:field="*{fullName}" required/>
                <div class="err" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
            </div>
            <div class="field">
                <label>Email</label>
                <input type="email" th:field="*{email}" required/>
                <div class="err" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>
            <div class="field">
                <label>Password</label>
                <input type="password" th:field="*{password}" required/>
                <div class="err" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
            </div>
            <div class="field">
                <label>Phone (optional)</label>
                <input type="text" th:field="*{phone}"/>
            </div>
            <div class="field">
                <label>Address (optional)</label>
                <input type="text" th:field="*{address}"/>
            </div>
            <div class="field">
                <label>City (optional)</label>
                <input type="text" th:field="*{city}"/>
            </div>

            <button class="btn" type="submit" style="width:100%">Sign up</button>
        </form>

        <p style="text-align:center; margin-top: 16px;">
            Already have an account? <a th:href="@{/login}">Log in</a>
        </p>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
