<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin-layout :: head('Car')}"></head>
<body>

<div class="admin-shell">
    <aside th:replace="~{fragments/admin-layout :: sidebar('cars')}"></aside>

    <main class="admin-main">
        <h1 th:text="${mode == 'edit'} ? 'Edit car' : 'Add new car'">Car</h1>

        <div class="form-card" style="max-width: 720px; margin: 0;">
            <form th:action="@{/admin/cars/save}" th:object="${form}" method="post">
                <!-- Hidden id makes the same form endpoint handle both create & update. -->
                <input type="hidden" th:field="*{id}"/>

                <div class="field">
                    <label>Make</label>
                    <input type="text" th:field="*{make}"/>
                    <div class="err" th:if="${#fields.hasErrors('make')}" th:errors="*{make}"></div>
                </div>
                <div class="field">
                    <label>Model</label>
                    <input type="text" th:field="*{model}"/>
                    <div class="err" th:if="${#fields.hasErrors('model')}" th:errors="*{model}"></div>
                </div>
                <div class="field">
                    <label>Year</label>
                    <input type="number" th:field="*{year}"/>
                    <div class="err" th:if="${#fields.hasErrors('year')}" th:errors="*{year}"></div>
                </div>
                <div class="field">
                    <label>Price (₦)</label>
                    <input type="number" step="0.01" th:field="*{price}"/>
                    <div class="err" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
                </div>
                <div class="field">
                    <label>Mileage (km)</label>
                    <input type="number" th:field="*{mileage}"/>
                </div>
                <div class="field">
                    <label>Colour</label>
                    <input type="text" th:field="*{color}"/>
                </div>
                <div class="field">
                    <label>Body type</label>
                    <input type="text" th:field="*{bodyType}" placeholder="Sedan, SUV..."/>
                </div>
                <div class="field">
                    <label>Transmission</label>
                    <input type="text" th:field="*{transmission}" placeholder="Automatic / Manual"/>
                </div>
                <div class="field">
                    <label>Fuel type</label>
                    <input type="text" th:field="*{fuelType}" placeholder="Petrol / Diesel / Electric"/>
                </div>
                <div class="field">
                    <label>Image URL</label>
                    <input type="text" th:field="*{imageUrl}" placeholder="https://..."/>
                </div>
                <div class="field">
                    <label>Description</label>
                    <textarea rows="4" th:field="*{description}"></textarea>
                </div>

                <div style="display:flex; gap: 8px;">
                    <button class="btn" type="submit">Save</button>
                    <a class="btn btn-outline" th:href="@{/admin/cars}">Cancel</a>
                </div>
            </form>
        </div>
    </main>
</div>

</body>
</html>
