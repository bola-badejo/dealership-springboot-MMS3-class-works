<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin-layout :: head('Inventory')}"></head>
<body>

<div class="admin-shell">
    <aside th:replace="~{fragments/admin-layout :: sidebar('cars')}"></aside>

    <main class="admin-main">
        <h1>Inventory</h1>

        <div th:if="${msg}" class="alert alert-success" th:text="${msg}"></div>

        <div class="table-card">
            <div class="table-head">
                <h2 th:text="${#lists.size(cars)} + ' cars'">Cars</h2>
                <a class="btn" th:href="@{/admin/cars/new}">+ Add car</a>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Car</th><th>Year</th><th>Price</th><th>Status</th><th style="width:200px">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(cars)}">
                        <td colspan="5" style="text-align:center; color: var(--muted);">Inventory is empty.</td>
                    </tr>
                    <tr th:each="c : ${cars}">
                        <td th:text="|${c.make} ${c.model}|">Car</td>
                        <td th:text="${c.year}">0</td>
                        <td th:text="'₦ ' + ${#numbers.formatDecimal(c.price, 1, 'COMMA', 2, 'POINT')}">₦ 0</td>
                        <td>
                            <span class="badge"
                                  th:classappend="${c.status.name() == 'AVAILABLE' ? 'badge-available' :
                                                  (c.status.name() == 'SOLD' ? 'badge-sold' : 'badge-reserved')}"
                                  th:text="${c.status}">AVAILABLE</span>
                        </td>
                        <td>
                            <div class="actions">
                                <a class="btn btn-outline" th:href="@{'/admin/cars/' + ${c.id} + '/edit'}">Edit</a>
                                <!-- Inline form so delete is a POST (safer than GET). -->
                                <form th:action="@{'/admin/cars/' + ${c.id} + '/delete'}"
                                      method="post"
                                      onsubmit="return confirm('Delete this car?');">
                                    <button class="btn btn-danger" type="submit">Delete</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>

</body>
</html>
